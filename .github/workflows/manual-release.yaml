name: release-manual

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (e.g. 0.5.1). Leave blank to auto-increment the patch version."
        required: false
        default: ""
        type: string
      prerelease:
        description: "Mark as prerelease?"
        required: true
        default: false
        type: boolean
      release_notes:
        description: "Release description (Markdown supported). Leave blank to auto-generate."
        required: false
        default: ""
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: setup-node
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: "npm"

      - name: install
        run: npm ci

      - name: determine version
        id: determine-version
        run: |
          node - <<'NODE'
          const fs = require("fs");

          const inputVersion = process.env.INPUT_VERSION;

          if (inputVersion) {
            fs.appendFileSync(process.env.GITHUB_OUTPUT, `version=${inputVersion}\n`);
          } else {
            const pkg = JSON.parse(fs.readFileSync("package.json", "utf8"));
            const parts = pkg.version.split(".").map(Number);

            if (parts.length !== 3 || parts.some(Number.isNaN)) {
              console.error(`Unexpected current version: ${pkg.version}`);
              process.exit(1);
            }

            const [major, minor, patch] = parts;
            const nextVersion = `${major}.${minor}.${patch + 1}`;
            fs.appendFileSync(process.env.GITHUB_OUTPUT, `version=${nextVersion}\n`);
          }
          NODE
        env:
          INPUT_VERSION: ${{ inputs.version }}

      - name: bump versions in json
        run: |
          node - <<'NODE'
          const fs = require("fs");

          const version = process.env.RELEASE_VERSION;

          if (!version) {
            console.error("Missing RELEASE_VERSION");
            process.exit(1);
          }

          const readJson = (path) => JSON.parse(fs.readFileSync(path, "utf8"));
          const writeJson = (path, data) =>
            fs.writeFileSync(path, JSON.stringify(data, null, "\t") + "\n");

          const pkg = readJson("package.json");
          pkg.version = version;
          writeJson("package.json", pkg);

          const manifest = readJson("manifest.json");
          manifest.version = version;
          writeJson("manifest.json", manifest);

          // Keep versions.json mapping up to date
          const versions = readJson("versions.json");
          versions[version] = manifest.minAppVersion;
          writeJson("versions.json", versions);
          NODE
        env:
          RELEASE_VERSION: ${{ steps.determine-version.outputs.version }}

      - name: sync package-lock.json version
        run: npm install --package-lock-only

      - name: commit version bump
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json manifest.json versions.json
          git commit -m "chore(release): ${{ steps.determine-version.outputs.version }}" || echo "No changes to commit"
          git push

      - name: create tag
        run: |
          git tag "${{ steps.determine-version.outputs.version }}"
          git push origin "${{ steps.determine-version.outputs.version }}"

      - name: build
        run: npm run build

      - name: verify artifacts
        run: |
          test -f main.js
          test -f manifest.json
          test -f styles.css

      - name: create github release + upload assets
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.determine-version.outputs.version }}
          name: ${{ steps.determine-version.outputs.version }}
          prerelease: ${{ inputs.prerelease }}
          generate_release_notes: ${{ inputs.release_notes == '' }}
          body: ${{ inputs.release_notes }}
          files: |
            main.js
            manifest.json
            styles.css
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
